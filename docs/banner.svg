<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="NoteCraft — a calm, fast, private home for everything on your mind">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF8F4"/>
      <stop offset="1" stop-color="#EFEBE3"/>
    </linearGradient>
    <linearGradient id="brand" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3F7CF2"/>
      <stop offset="1" stop-color="#1F4FC2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1C1B19" flood-opacity="0.12"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1F4FC2" flood-opacity="0.35"/>
    </filter>
    <pattern id="rules" width="1280" height="34" patternUnits="userSpaceOnUse">
      <line x1="0" y1="33.5" x2="1280" y2="33.5" stroke="#1C1B19" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Paper -->
  <rect width="1280" height="420" rx="28" fill="url(#paper)"/>
  <rect width="1280" height="420" rx="28" fill="url(#rules)"/>
  <line x1="78" y1="0" x2="78" y2="420" stroke="#E8846F" stroke-opacity="0.25" stroke-width="2"/>

  <!-- App icon -->
  <g transform="translate(118 112)" filter="url(#lift)">
    <rect width="184" height="184" rx="46" fill="url(#brand)"/>
    <g transform="translate(-37.6 -37.6) scale(2.4)">
      <path fill="#000" fill-opacity="0.15" d="M41,30H63L75,42V76A6,6 0,0 1,69 82H41A6,6 0,0 1,35 76V36A6,6 0,0 1,41 30Z"/>
      <path fill="#FFFFFF" d="M40,28H62L74,40V74A6,6 0,0 1,68 80H40A6,6 0,0 1,34 74V34A6,6 0,0 1,40 28Z"/>
      <path fill="#D5E1FB" d="M62,28V36A4,4 0,0 0,66 40H74Z"/>
      <path stroke="#2F6BEA" stroke-width="4.5" stroke-linecap="round" d="M42,47H58"/>
      <path fill="#FFD66B" d="M40.5,52.5h21a3.5,3.5 0,0 1,0 7h-21a3.5,3.5 0,0 1,0 -7z"/>
      <path stroke="#B9C9EE" stroke-width="3.2" stroke-linecap="round" d="M42,56H61"/>
      <path stroke="#B9C9EE" stroke-width="3.2" stroke-linecap="round" d="M42,64H66"/>
      <path stroke="#B9C9EE" stroke-width="3.2" stroke-linecap="round" d="M42,72H55"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'SF Pro Display', -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif">
    <text x="344" y="186" font-size="86" font-weight="700" letter-spacing="-3" fill="#1C1B19">NoteCraft</text>
    <text x="348" y="232" font-size="27" fill="#6F6A62">A calm, fast, private home</text>
    <text x="348" y="267" font-size="27" fill="#6F6A62">for everything on your mind.</text>

    <g font-size="17" font-weight="600">
      <rect x="346" y="300" width="148" height="38" rx="19" fill="#2F6BEA" fill-opacity="0.1"/>
      <text x="420" y="325" text-anchor="middle" fill="#2F6BEA">Native Android</text>
      <rect x="506" y="300" width="118" height="38" rx="19" fill="#2F6BEA" fill-opacity="0.1"/>
      <text x="565" y="325" text-anchor="middle" fill="#2F6BEA">Markdown</text>
      <rect x="636" y="300" width="100" height="38" rx="19" fill="#2F6BEA" fill-opacity="0.1"/>
      <text x="686" y="325" text-anchor="middle" fill="#2F6BEA">Offline</text>
      <rect x="748" y="300" width="96" height="38" rx="19" fill="#C77A12" fill-opacity="0.12"/>
      <text x="796" y="325" text-anchor="middle" fill="#B06A0B">3.4 MB</text>
    </g>
  </g>

  <!-- Floating notes -->
  <g font-family="'Segoe UI', -apple-system, Roboto, Arial, sans-serif">
    <!-- Sand idea note -->
    <g transform="translate(952 52) rotate(-6)" filter="url(#soft)">
      <rect width="210" height="150" rx="20" fill="#F9F0CC"/>
      <text x="20" y="38" font-size="18" font-weight="700" fill="#1C1B19">Ideas worth keeping</text>
      <rect x="20" y="56" width="150" height="9" rx="4.5" fill="#1C1B19" fill-opacity="0.16"/>
      <rect x="20" y="76" width="168" height="9" rx="4.5" fill="#1C1B19" fill-opacity="0.16"/>
      <rect x="20" y="96" width="110" height="9" rx="4.5" fill="#1C1B19" fill-opacity="0.16"/>
      <rect x="20" y="116" width="62" height="22" rx="11" fill="#1C1B19" fill-opacity="0.07"/>
      <text x="51" y="132" text-anchor="middle" font-size="12" fill="#6F6A62">#ideas</text>
    </g>
    <!-- Checklist -->
    <g transform="translate(1046 168) rotate(5)" filter="url(#soft)">
      <rect width="196" height="176" rx="20" fill="#FFFFFF" stroke="#E9E5DD"/>
      <text x="20" y="36" font-size="17" font-weight="700" fill="#1C1B19">Groceries</text>
      <rect x="20" y="48" width="156" height="5" rx="2.5" fill="#1C1B19" fill-opacity="0.08"/>
      <rect x="20" y="48" width="94" height="5" rx="2.5" fill="#2F6BEA"/>
      <circle cx="30" cy="78" r="8" fill="#2F6BEA"/>
      <path d="M26 78l3 3 5-6" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="73" width="90" height="9" rx="4.5" fill="#1C1B19" fill-opacity="0.12"/>
      <circle cx="30" cy="106" r="8" fill="#2F6BEA"/>
      <path d="M26 106l3 3 5-6" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="101" width="110" height="9" rx="4.5" fill="#1C1B19" fill-opacity="0.12"/>
      <circle cx="30" cy="134" r="7.5" fill="none" stroke="#B4AFA6" stroke-width="2"/>
      <rect x="48" y="129" width="76" height="9" rx="4.5" fill="#1C1B19" fill-opacity="0.22"/>
    </g>
    <!-- Sky reminder note -->
    <g transform="translate(866 262) rotate(-3)" filter="url(#soft)">
      <rect width="168" height="112" rx="20" fill="#DEE9FA"/>
      <text x="18" y="36" font-size="16" font-weight="700" fill="#1C1B19">Call mom</text>
      <rect x="18" y="50" width="120" height="8" rx="4" fill="#1C1B19" fill-opacity="0.14"/>
      <rect x="18" y="72" width="132" height="24" rx="12" fill="#2F6BEA" fill-opacity="0.14"/>
      <text x="84" y="89" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2F6BEA">⏰ Tomorrow, 6:00 PM</text>
    </g>
  </g>
</svg>
